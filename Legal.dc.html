<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rudy Claire — оферта и политика</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script src="./react.js"></script>
<script src="./react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#5E5E5A}
a:focus-visible{outline:2px solid #111111;outline-offset:3px}
</style>
</helmet>
<div style="font-family: 'Onest', sans-serif; color: #111111; background: #FFFFFF">
<header style="background: #111111; color: #FFFFFF">
<div style="max-width: 880px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<a href="Main.dc.html" style="color: #FFFFFF; text-decoration: none; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px">RUDY CLAIRE</a>
<nav style="display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px"><a href="#offer" style="color: #FFFFFF">Оферта</a><a href="#privacy" style="color: #FFFFFF">Политика конфиденциальности</a></nav>
</div>
</header>
<main style="max-width: 880px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 40px) 80px">

<sc-for list="{{docs}}" as="doc" hint-placeholder-count="2">
<article id="{{doc.id}}" style="margin-bottom: 80px">
<h1 style="margin: 0 0 8px; font-size: clamp(24px, 7vw, 36px); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere">{{doc.title}}</h1>
<p style="margin: 0 0 40px; font-size: 14px; color: #5E5E5A">{{doc.sub}}</p>
<sc-for list="{{doc.sections}}" as="s" hint-placeholder-count="6">
<section style="margin-bottom: 32px">
<h2 style="margin: 0 0 12px; font-size: 20px; font-weight: 600">{{s.h}}</h2>
<sc-for list="{{s.ps}}" as="p" hint-placeholder-count="3">
<p style="margin: 0 0 10px; font-size: 16px; line-height: 1.65; color: #2B2B28">{{p}}</p>
</sc-for>
</section>
</sc-for>
</article>
</sc-for>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {
  renderVals() {
    const SELLER = '[Наименование продавца, ИНН, ОГРН/ОГРНИП]';
    const EMAIL = '[EMAIL]';
    const offer = {
      id: 'offer',
      title: 'Публичная оферта',
      sub: 'Договор розничной купли-продажи товаров дистанционным способом · редакция от [ДАТА]',
      sections: [
        { h: '1. Общие положения', ps: [
          '1.1. Настоящий документ является публичной офертой ' + SELLER + ' (далее — Продавец) в адрес любого физического лица (далее — Покупатель) и содержит все существенные условия договора розничной купли-продажи товаров, представленных на сайте Rudy Claire (далее — Сайт).',
          '1.2. В соответствии с п. 3 ст. 438 Гражданского кодекса РФ оформление заказа на Сайте или через официальные мессенджеры Продавца и его подтверждение Покупателем является полным и безоговорочным акцептом настоящей оферты.',
          '1.3. Отношения сторон регулируются Гражданским кодексом РФ, Законом РФ «О защите прав потребителей» и Правилами продажи товаров по договору розничной купли-продажи (утв. постановлением Правительства РФ от 31.12.2020 № 2463).',
          '1.4. Продавец вправе изменять условия оферты. Изменения вступают в силу с момента публикации на Сайте и не распространяются на уже оформленные заказы.'
        ]},
        { h: '2. Предмет договора', ps: [
          '2.1. Продавец обязуется передать в собственность Покупателя товар — одежду под маркой Rudy Claire (далее — Товар), а Покупатель обязуется принять и оплатить Товар на условиях настоящей оферты.',
          '2.2. Описание, состав, размеры и цена Товара указаны в карточке Товара на Сайте. Цвет Товара на фотографиях может незначительно отличаться от реального из-за настроек экрана устройства Покупателя.'
        ]},
        { h: '3. Оформление заказа', ps: [
          '3.1. Покупатель оформляет заказ через корзину на Сайте либо через мессенджеры, указанные на Сайте, сообщая имя, контактный телефон, адрес электронной почты, адрес и способ доставки.',
          '3.2. Покупатель несёт ответственность за достоверность указанных данных. Продавец вправе связаться с Покупателем для подтверждения заказа.',
          '3.3. Коллекции выпускаются ограниченным тиражом. Если Товар закончился после оформления заказа, Продавец сообщает об этом Покупателю и возвращает полученную оплату в полном объёме.'
        ]},
        { h: '4. Цена и оплата', ps: [
          '4.1. Цена Товара указывается на Сайте в рублях. Стоимость доставки не входит в цену Товара и сообщается Покупателю при оформлении заказа.',
          '4.2. Способы оплаты: банковской картой онлайн на Сайте через платёжный сервис; наличными при получении — для способов доставки, где это доступно; частями через сервис «Сплит» — на условиях, установленных сервисом.',
          '4.3. При оплате Покупателю направляется кассовый чек в соответствии с Федеральным законом № 54-ФЗ на указанный адрес электронной почты или телефон.'
        ]},
        { h: '5. Доставка', ps: [
          '5.1. Доставка осуществляется по Москве и всей России службами СДЭК, Яндекс Доставка, Почта России, а также курьером по Москве. Доступные способы предлагаются при оформлении заказа.',
          '5.2. Стоимость и сроки доставки определяются тарифами выбранной службы доставки. Ориентировочный срок передачи заказа в службу доставки — [СРОК] рабочих дней с момента подтверждения заказа.',
          '5.3. Право собственности и риск случайной гибели Товара переходят к Покупателю с момента передачи Товара Покупателю. При получении Покупатель проверяет комплектность и внешний вид Товара.'
        ]},
        { h: '6. Обмен и возврат', ps: [
          '6.1. Покупатель вправе отказаться от Товара в любое время до его передачи, а после передачи — в течение 7 дней. Если информация о порядке и сроках возврата не была предоставлена в письменной форме при доставке, срок составляет 3 месяца с момента передачи Товара (п. 4 ст. 26.1 Закона «О защите прав потребителей»).',
          '6.2. Возврат Товара надлежащего качества возможен, если сохранены его товарный вид, потребительские свойства, ярлыки, а также документ, подтверждающий покупку.',
          '6.3. Продавец возвращает уплаченную за Товар сумму не позднее 10 дней с даты получения требования, за вычетом расходов Продавца на доставку возвращённого Товара от Покупателя.',
          '6.4. Если Товар не подошёл по размеру, Продавец по согласованию с Покупателем обменивает его на другой размер при наличии на складе.',
          '6.5. Требования в отношении Товара ненадлежащего качества рассматриваются в соответствии со ст. 18 Закона «О защите прав потребителей».',
          '6.6. Для обмена или возврата Покупатель направляет заявление на ' + EMAIL + ' или в мессенджеры Продавца.'
        ]},
        { h: '7. Ответственность сторон', ps: [
          '7.1. Стороны несут ответственность за неисполнение или ненадлежащее исполнение обязательств в соответствии с законодательством РФ.',
          '7.2. Продавец не отвечает за задержки доставки, возникшие по вине службы доставки или вследствие обстоятельств непреодолимой силы.'
        ]},
        { h: '8. Персональные данные', ps: [
          '8.1. Оформляя заказ, Покупатель даёт согласие на обработку своих персональных данных в целях исполнения договора в соответствии с Политикой конфиденциальности, опубликованной на Сайте.'
        ]},
        { h: '9. Разрешение споров', ps: [
          '9.1. Споры решаются путём переговоров. Претензии направляются на ' + EMAIL + ', срок ответа — 10 дней.',
          '9.2. При недостижении согласия спор передаётся в суд в соответствии с законодательством РФ.'
        ]},
        { h: '10. Реквизиты Продавца', ps: [
          SELLER,
          'Адрес: [АДРЕС]',
          'Email: ' + EMAIL + ' · Телефон: [ТЕЛЕФОН]'
        ]}
      ]
    };
    const privacy = {
      id: 'privacy',
      title: 'Политика конфиденциальности',
      sub: 'Политика в отношении обработки персональных данных · редакция от [ДАТА]',
      sections: [
        { h: '1. Общие положения', ps: [
          '1.1. Настоящая политика составлена в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» (далее — Закон о персональных данных) и определяет порядок обработки персональных данных и меры по их защите, принимаемые ' + SELLER + ' (далее — Оператор).',
          '1.2. Политика применяется ко всей информации, которую Оператор может получить о посетителях сайта Rudy Claire (далее — Сайт).'
        ]},
        { h: '2. Основные понятия', ps: [
          '2.1. Персональные данные — любая информация, относящаяся прямо или косвенно к определённому или определяемому пользователю Сайта.',
          '2.2. Обработка персональных данных — любое действие с персональными данными, включая сбор, запись, систематизацию, накопление, хранение, уточнение, извлечение, использование, передачу, обезличивание, блокирование, удаление и уничтожение.',
          '2.3. Пользователь — любой посетитель Сайта.'
        ]},
        { h: '3. Права и обязанности Оператора', ps: [
          '3.1. Оператор обязан предоставлять субъекту персональных данных по его просьбе информацию об обработке его данных, отвечать на обращения в соответствии с Законом о персональных данных, принимать правовые, организационные и технические меры для защиты данных от неправомерного доступа, уничтожения, изменения, блокирования, копирования и распространения.',
          '3.2. Оператор вправе самостоятельно определять состав мер, необходимых для выполнения обязанностей, предусмотренных Законом о персональных данных.'
        ]},
        { h: '4. Права пользователя', ps: [
          '4.1. Пользователь вправе получать информацию об обработке его персональных данных, требовать их уточнения, блокирования или уничтожения, отозвать согласие на обработку и обжаловать действия Оператора в уполномоченном органе или в суде.'
        ]},
        { h: '5. Какие данные обрабатываются', ps: [
          '5.1. Фамилия, имя; номер телефона; адрес электронной почты; адрес доставки.',
          '5.2. Обезличенные данные о посетителях (в том числе файлы cookie), собираемые сервисом веб-аналитики Яндекс Метрика (ООО «ЯНДЕКС») для анализа работы Сайта. При первом посещении Пользователь информируется об этом cookie-баннером.',
          '5.3. Оператор не обрабатывает специальные категории персональных данных (расовая и национальная принадлежность, политические взгляды, религиозные убеждения, здоровье, интимная жизнь).'
        ]},
        { h: '6. Цели обработки', ps: [
          '6.1. Оформление, оплата и доставка заказов; заключение и исполнение договора купли-продажи; связь с Пользователем по вопросам заказа.',
          '6.2. Информирование о новых коллекциях — только с отдельного согласия Пользователя. Отказаться от рассылки можно в любой момент, написав на ' + EMAIL + '.',
          '6.3. Улучшение работы Сайта на основе обезличенной статистики.'
        ]},
        { h: '7. Правовые основания', ps: [
          '7.1. Федеральный закон № 152-ФЗ «О персональных данных», Федеральный закон № 149-ФЗ «Об информации, информационных технологиях и о защите информации», договоры с Пользователем и согласие Пользователя на обработку персональных данных.',
          '7.2. Оператор обрабатывает персональные данные только если Пользователь сам заполнил и отправил их через формы на Сайте или в мессенджерах. Отправляя данные, Пользователь выражает согласие с настоящей Политикой.'
        ]},
        { h: '8. Передача третьим лицам', ps: [
          '8.1. Для исполнения заказа данные в необходимом объёме передаются: платёжному сервису — для приёма оплаты картой; сервису «Сплит» — при выборе оплаты частями; службам доставки СДЭК, Яндекс Доставка, Почта России — для доставки заказа; платформе Tilda, на которой работает Сайт, — для приёма и хранения заявок.',
          '8.2. Указанные лица обрабатывают данные в соответствии со своими политиками конфиденциальности. В иных случаях данные третьим лицам не передаются, за исключением требований законодательства РФ.',
          '8.3. Трансграничная передача персональных данных не осуществляется.'
        ]},
        { h: '9. Хранение и прекращение обработки', ps: [
          '9.1. Данные хранятся не дольше, чем этого требуют цели обработки, но не более 3 лет с момента получения или до отзыва согласия, если более длительный срок не установлен законом (в том числе для бухгалтерских документов).',
          '9.2. Чтобы уточнить данные или отозвать согласие, направьте письмо на ' + EMAIL + ' с пометкой «Актуализация персональных данных» или «Отзыв согласия на обработку персональных данных».'
        ]},
        { h: '10. Заключительные положения', ps: [
          '10.1. Разъяснения по вопросам обработки персональных данных можно получить, написав на ' + EMAIL + '.',
          '10.2. Политика действует бессрочно до замены новой версией. Актуальная версия всегда опубликована на Сайте.'
        ]}
      ]
    };
    return { docs: [offer, privacy] };
  }
}
</script>
</body>
</html>
